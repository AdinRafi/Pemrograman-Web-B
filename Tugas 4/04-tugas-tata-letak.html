<!doctype html>

<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Jurnal Ilmiah Multi Kolom (Tugas Mandiri 4)</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="04-tugas-style.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="main-header-content">
        <h1 class="title">Portal Jurnal Ilmiah Fakultas Teknik</h1>
      </div>
      <nav class="main-nav">
        <a href="#" class="main-nav-link">Beranda</a>
        <a href="#" class="main-nav-link">Arsip Jurnal</a>
        <a href="#" class="main-nav-link">Tentang</a>
        <a href="#" class="main-nav-link">Kontak</a>
      </nav>
    </header>

    <!-- Tata Letak Utama CSS Grid -->
    <main class="layout-wrapper container-fluid mt-4 mb-5">
      <!-- Kolom Kiri -->
      <aside class="sidebar-left">
        <div class="card border-danger shadow-sm">
          <div class="card-header bg-danger text-white fw-bold">
            Menu Navigasi
          </div>
          <div class="p-3 text-muted">Isi menu di Tahap 5...</div>
        </div>
      </aside>

      <!-- Kolom Tengah -->
      <section class="content-main">
        <h2 class="h5 mb-3 border-bottom border-danger pb-2 text-danger">
          Publikasi Terbaru
        </h2>
        <div class="card-grid">
          <div class="p-3 border border-danger text-muted">
            Area Kartu Artikel...
          </div>
        </div>
      </section>

      <!-- Kolom Kanan -->
      <aside class="sidebar-right">
        <div
          class="card border-0 shadow-sm bg-white border-top border-danger border-3"
        >
          <div class="card-body">
            <h3 class="h6 card-title border-bottom pb-2">Statistik Jurnal</h3>
            <div class="text-muted">Isi statistik di Tahap 5...</div>
          </div>
        </div>
      </aside>
    </main>

    <!-- Footer -->
    <footer
      class="bg-dark text-white text-center py-3 border-top border-danger border-3"
    >
      <p class="mb-0 small">
        &copy; 2026 Portal Jurnal Ilmiah Fakultas Teknik.
      </p>
    </footer>
  </body>
</html>
